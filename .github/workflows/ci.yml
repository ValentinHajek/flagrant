# Tests à chaque push (le déploiement, lui, se fait sur hungry-morse : voir deploy/deploy.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:api
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
      - run: pnpm build
